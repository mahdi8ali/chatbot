<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد مشاريع الكفيل</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Readex Pro', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a1628;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 460px;
            height: 700px;
            background: #111827;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
            border: 1px solid #1f2937;
        }

        /* Header */
        .chat-header {
            background: #04504d;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
        }

        .chat-header .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .chat-header .info h2 {
            color: #fff;
            font-size: 15px;
            font-weight: 600;
        }

        .chat-header .info p {
            color: #a7f3d0;
            font-size: 12px;
            margin-top: 2px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #34d399;
            border-radius: 50%;
            display: inline-block;
            margin-left: 5px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .clear-btn {
            margin-right: auto;
            background: rgba(255,255,255,0.15);
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
            transition: background 0.2s;
        }
        .clear-btn:hover { background: rgba(255,255,255,0.25); }

        /* Messages Area */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        .chat-messages::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }

        /* Message Bubbles */
        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.7;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-start;
            background: #065f46;
            color: #fff;
        }

        .message.bot {
            align-self: flex-end;
            background: #1f2937;
            color: #e5e7eb;
            border: 1px solid #374151;
        }

        .message.bot a {
            color: #34d399;
            text-decoration: none;
        }
        .message.bot a:hover { text-decoration: underline; }
        .message.bot strong { color: #fff; }

        /* Typing Indicator */
        .typing {
            align-self: flex-end;
            background: #1f2937;
            border: 1px solid #374151;
            padding: 12px 18px;
            border-radius: 12px;
            display: flex;
            gap: 5px;
            animation: fadeIn 0.3s ease;
        }

        .typing span {
            width: 7px;
            height: 7px;
            background: #6b7280;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing span:nth-child(1) { animation-delay: 0s; }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Welcome */
        .welcome {
            text-align: center;
            color: #6b7280;
            padding: 30px 20px;
        }
        .welcome .icon { margin-bottom: 12px; }
        .welcome .icon img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; }
        .welcome h3 { color: #9ca3af; font-size: 16px; margin-bottom: 8px; }
        .welcome p { font-size: 13px; line-height: 1.8; }

        .quick-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 16px;
        }

        .quick-btn {
            background: #1f2937;
            border: 1px solid #374151;
            color: #d1d5db;
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .quick-btn:hover {
            background: #065f46;
            border-color: #047857;
            color: #fff;
        }

        /* Input Area */
        .chat-input {
            padding: 12px 16px;
            background: #111827;
            border-top: 1px solid #1f2937;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .chat-input textarea {
            flex: 1;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 10px 14px;
            color: #e5e7eb;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            outline: none;
            max-height: 100px;
            min-height: 42px;
            line-height: 1.5;
            transition: border-color 0.2s;
        }

        .chat-input textarea:focus { border-color: #047857; }
        .chat-input textarea::placeholder { color: #6b7280; }

        .send-btn {
            width: 42px;
            height: 42px;
            background: #f3bf3d;
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            flex-shrink: 0;
            transform: scaleX(-1);
        }
        .send-btn:hover { background: #d4a832; }
        .send-btn:disabled { background: #374151; cursor: not-allowed; }

        /* Message count */
        .msg-count {
            text-align: center;
            font-size: 11px;
            color: #4b5563;
            padding: 4px;
        }

        /* Markdown-like */
        .message.bot ol, .message.bot ul { padding-right: 20px; margin: 6px 0; }
        .message.bot li { margin: 4px 0; }
        .message.bot p { margin: 4px 0; }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="avatar"><img src="public/logo.png" alt="مساعد الكفيل"></div>
            <div class="info">
                <h2>مساعد مشاريع الكفيل</h2>
                <p><span class="status-dot"></span> متصل</p>
            </div>
            <button class="clear-btn" onclick="clearChat()" title="محادثة جديدة">+ محادثة جديدة</button>
        </div>

        <!-- Messages -->
        <div class="chat-messages" id="chatMessages">
            <div class="welcome" id="welcomeScreen">
                <div class="icon"><img src="public/logo.png" alt="مساعد الكفيل"></div>
                <h3>مرحباً بك ، انا مساعدك الشخصي </h3>
                <p> اسألني أي سؤال عن مشاريع العتبة العباسية المقدسة وتفاصيلهن بشكل كامل </p>
                <div class="quick-btns">
                    <button class="quick-btn" onclick="sendQuick('أعرض لي المشاريع الثقافية')">📚 المشاريع الثقافية</button>
                    <button class="quick-btn" onclick="sendQuick('أعرض لي المشاريع التعليمية')">🎓 المشاريع التعليمية</button>
                    <button class="quick-btn" onclick="sendQuick('أعرض لي مشاريع الصحن ومقترباته')">🕌 مشاريع الصحن ومقترباته</button>
                    <button class="quick-btn" onclick="sendQuick('أعرض لي المشاريع الطبية')">🏥 المشاريع الطبية</button>
                    <button class="quick-btn" onclick="sendQuick('أعرض لي المشاريع التنموية')">📈 المشاريع التنموية</button>
                    <button class="quick-btn" onclick="sendQuick('أعرض لي خدمات عامة')">🔧 خدمات عامة</button>
                    <button class="quick-btn" onclick="sendQuick('أعرض لي تشكيلات إدارية')">🏛️ تشكيلات إدارية</button>
                </div>
            </div>
        </div>

        <!-- Message count -->
        <div class="msg-count" id="msgCount"></div>

        <!-- Input -->
        <div class="chat-input">
            <textarea id="msgInput" rows="1" placeholder="اكتب رسالتك هنا..." onkeydown="handleKey(event)"></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        // ==================== State ====================
        let API_URL = '';
        const POSSIBLE_URLS = [
            'http://localhost:3000/api/chat/site',
            'http://localhost:3001/api/chat/site'
        ];
        let isLoading = false;

        /**
         * ✅ سجل المحادثة الكامل
         * يُرسل بالكامل مع كل طلب جديد حتى يفهم GPT السياق
         * مثال:
         *   [
         *     { role: "user", content: "من صمّم شباك قاسم بن الإمام موسى؟" },
         *     { role: "assistant", content: "شباك مزار القاسم بن الإمام موسى..." },
         *     { role: "user", content: "كم كيلو نحاس استخدم فيه؟" }  ← GPT يعرف أن "فيه" = الشباك
         *   ]
         */
        let conversationHistory = [];

        // ==================== Init ====================
        window.addEventListener('load', findServer);

        async function findServer() {
            for (const url of POSSIBLE_URLS) {
                try {
                    const res = await fetch(url, {
                        method: 'OPTIONS',
                        headers: { 'Origin': window.location.origin || 'null' }
                    });
                    if (res.ok || res.status === 204) {
                        API_URL = url;
                        console.log('✅ Server found:', url);
                        return;
                    }
                } catch (e) { /* try next */ }
            }
            addBotMessage('❌ لم يتم العثور على الخادم. تأكد من تشغيل: npm run dev');
        }

        // ==================== Chat Logic ====================
        function sendQuick(text) {
            document.getElementById('msgInput').value = text;
            sendMessage();
        }

        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text || isLoading || !API_URL) return;

            // Hide welcome
            const welcome = document.getElementById('welcomeScreen');
            if (welcome) welcome.remove();

            // Add user message to UI
            addUserMessage(text);
            input.value = '';
            autoResize(input);

            // ✅ إضافة رسالة المستخدم لسجل المحادثة
            conversationHistory.push({ role: 'user', content: text });
            updateMsgCount();

            // Show typing
            isLoading = true;
            document.getElementById('sendBtn').disabled = true;
            const typingEl = showTyping();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Origin': window.location.origin || 'null'
                    },
                    body: JSON.stringify({
                        /**
                         * ✅ إرسال كل سجل المحادثة وليس آخر رسالة فقط
                         * هذا هو الفرق الأساسي بين "سؤال وجواب" و "شات تتابعي"
                         * GPT يستقبل كل الرسائل السابقة فيفهم السياق
                         */
                        messages: conversationHistory,
                        chatSettings: {
                            model: 'gpt-4o',
                            prompt: 'user',
                            temperature: 0.5
                        }
                    })
                });

                typingEl.remove();

                if (!response.ok) {
                    throw new Error('خطأ ' + response.status);
                }

                const data = await response.json();
                const botReply = data.message || data.reply || 'لم أتمكن من فهم الرد.';

                // ✅ إضافة رد البوت لسجل المحادثة — المرة القادمة يعرف GPT ماذا أجاب
                conversationHistory.push({ role: 'assistant', content: botReply });
                updateMsgCount();

                addBotMessage(botReply);

            } catch (err) {
                typingEl.remove();
                addBotMessage('⚠️ حدث خطأ في الاتصال. حاول مرة أخرى.');
                console.error('Error:', err);
            } finally {
                isLoading = false;
                document.getElementById('sendBtn').disabled = false;
                input.focus();
            }
        }

        // ==================== UI Helpers ====================
        function addUserMessage(text) {
            const div = document.createElement('div');
            div.className = 'message user';
            div.textContent = text;
            document.getElementById('chatMessages').appendChild(div);
            scrollToBottom();
        }

        function addBotMessage(text) {
            const div = document.createElement('div');
            div.className = 'message bot';
            div.innerHTML = renderMarkdown(text);
            document.getElementById('chatMessages').appendChild(div);
            scrollToBottom();
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'typing';
            div.innerHTML = '<span></span><span></span><span></span>';
            document.getElementById('chatMessages').appendChild(div);
            scrollToBottom();
            return div;
        }

        function scrollToBottom() {
            const container = document.getElementById('chatMessages');
            setTimeout(() => container.scrollTop = container.scrollHeight, 50);
        }

        function updateMsgCount() {
            const count = conversationHistory.length;
            document.getElementById('msgCount').textContent = 
                count > 0 ? `المحادثة: ${count} رسالة` : '';
        }

        function clearChat() {
            // ✅ مسح سجل المحادثة بالكامل — بداية جديدة
            conversationHistory = [];
            updateMsgCount();
            const messages = document.getElementById('chatMessages');
            messages.innerHTML = `
                <div class="welcome" id="welcomeScreen">
                    <div class="icon"><img src="public/logo.png" alt="مساعد الكفيل"></div>
                    <h3>مرحباً بك ، انا مساعدك الشخصي </h3>
                    <p>اسألني أي سؤال عن المشاريع وسأتذكر سياق محادثتنا<br>يمكنك السؤال والمتابعة كأنك تتحدث مع شخص حقيقي</p>
                    <div class="quick-btns">
                        <button class="quick-btn" onclick="sendQuick('أعرض لي المشاريع الثقافية')">📚 المشاريع الثقافية</button>
                        <button class="quick-btn" onclick="sendQuick('أعرض لي المشاريع التعليمية')">🎓 المشاريع التعليمية</button>
                        <button class="quick-btn" onclick="sendQuick('أعرض لي مشاريع الصحن ومقترباته')">🕌 مشاريع الصحن ومقترباته</button>
                        <button class="quick-btn" onclick="sendQuick('أعرض لي المشاريع الطبية')">🏥 المشاريع الطبية</button>
                        <button class="quick-btn" onclick="sendQuick('أعرض لي المشاريع التنموية')">📈 المشاريع التنموية</button>
                        <button class="quick-btn" onclick="sendQuick('أعرض لي خدمات عامة')">🔧 خدمات عامة</button>
                        <button class="quick-btn" onclick="sendQuick('أعرض لي تشكيلات إدارية')">🏛️ تشكيلات إدارية</button>
                    </div>
                </div>
            `;
        }

        // Auto-resize textarea
        const input = document.getElementById('msgInput');
        input.addEventListener('input', () => autoResize(input));

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 100) + 'px';
        }

        // ==================== Markdown Renderer ====================
        function renderMarkdown(text) {
            if (!text) return '';
            let html = text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
                .replace(/^(\d+)\.\s+(.+)$/gm, '<li>$2</li>')
                .replace(/^[-•]\s+(.+)$/gm, '<li>$1</li>')
                .replace(/^### (.+)$/gm, '<h3>$1</h3>')
                .replace(/^## (.+)$/gm, '<h2>$1</h2>')
                .replace(/\n/g, '<br>');
            
            html = html.replace(/((<li>.+?<\/li>)(<br>)?)+/g, (match) => {
                const items = match.replace(/<br>/g, '');
                return '<ol>' + items + '</ol>';
            });
            
            return html;
        }
    </script>
</body>
</html>
